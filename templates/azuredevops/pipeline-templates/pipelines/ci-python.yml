# devkit shared CI template — Python (extends template).
# Consumers: resources.repositories → this repo @ refs/tags/v1, then
#   extends: { template: pipelines/ci-python.yml@templates, parameters: { … } }
parameters:
  - name: vmImage
    type: string
    default: ubuntu-latest
  - name: timeoutInMinutes
    type: number
    default: 15
  - name: audit
    displayName: Run pip-audit (non-blocking)
    type: boolean
    default: true
  - name: installEnv
    displayName: Extra environment for the uv steps (e.g. UV_INDEX_AZURE_USERNAME / _PASSWORD)
    type: object
    default: {}
  - name: preInstallSteps
    displayName: Steps before `uv sync`
    type: stepList
    default: []
  - name: postSteps
    displayName: Steps after the quality gates
    type: stepList
    default: []

jobs:
  - job: quality
    displayName: Lint, type-check & test
    pool:
      vmImage: ${{ parameters.vmImage }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    cancelTimeoutInMinutes: 2
    variables:
      UV_CACHE_DIR: $(Pipeline.Workspace)/.uv
    steps:
      - checkout: self
        fetchDepth: 1

      - bash: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv

      - task: Cache@2
        displayName: Cache uv
        inputs:
          key: 'uv | "$(Agent.OS)" | uv.lock'
          restoreKeys: |
            uv | "$(Agent.OS)"
          path: $(UV_CACHE_DIR)

      - ${{ each step in parameters.preInstallSteps }}:
          - ${{ step }}

      - script: uv sync --locked --all-groups
        displayName: Install dependencies
        env: ${{ parameters.installEnv }}

      - ${{ if eq(parameters.audit, true) }}:
          - script: uv run --with pip-audit pip-audit
            displayName: Audit dependencies
            continueOnError: true
            env: ${{ parameters.installEnv }}

      - script: uv run ruff check . --output-format=concise
        displayName: Lint (Ruff)

      - script: uv run ruff format --check .
        displayName: Format check (Ruff)

      - script: uv run mypy .
        displayName: Type-check (mypy)

      - script: npx --yes markdownlint-cli2 "**/*.md"
        displayName: Lint (Markdown)

      - bash: |
          uv run pytest --junitxml="$(Build.ArtifactStagingDirectory)/junit.xml" \
            || { rc=$?; [ "$rc" -eq 5 ] && echo "no tests collected" || exit "$rc"; }
        displayName: Test (pytest)

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: $(Build.ArtifactStagingDirectory)/junit.xml
          failTaskOnFailedTests: false

      - ${{ each step in parameters.postSteps }}:
          - ${{ step }}
