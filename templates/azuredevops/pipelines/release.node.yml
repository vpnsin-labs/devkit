# Release — computes the next SemVer from Conventional Commits, bumps package.json,
# writes CHANGELOG.md and pushes the release commit + vX.Y.Z tag back to the branch.
# The Azure Repos counterpart of release-please. Run it manually from main
# (Pipelines → Run pipeline); it has no automatic trigger.
#
# One-time setup — the build service identity ("<Project> Build Service (<Org>)")
# needs these permissions on the repo: Contribute, Create tag, Bypass policies when
# pushing (Project settings → Repositories → <repo> → Security).
name: release_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: releaseAs
    displayName: Release as (empty = compute from commits; or 1.2.0 / major / minor / patch)
    type: string
    default: ' '
  - name: dryRun
    displayName: Dry run (print the next version + changelog, change nothing)
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

jobs:
  - job: release
    displayName: Bump version, changelog & tag
    timeoutInMinutes: 10
    steps:
      - checkout: self
        persistCredentials: true # keep the pipeline token so we can push
        fetchDepth: 0 # full history for the changelog

      - bash: |
          v=$(tr -d 'v \n' < .nvmrc); case "$v" in *.*) ;; *) v="$v.x";; esac
          echo "##vso[task.setvariable variable=NODE_VERSION]$v"
        displayName: Read .nvmrc

      - task: UseNode@1
        displayName: Setup Node $(NODE_VERSION)
        inputs:
          version: $(NODE_VERSION)

      # {{ARTIFACTS_AUTH}}
      - script: npm ci
        displayName: Install dependencies

      - bash: |
          set -euo pipefail
          branch="${BUILD_SOURCEBRANCH#refs/heads/}"
          git config user.name "Azure Pipelines"
          git config user.email "pipelines@dev.azure.com"
          git checkout -B "$branch" "$BUILD_SOURCEVERSION"

          args=""
          release_as="$(echo "$RELEASE_AS" | xargs)"
          [ -n "$release_as" ] && args="--release-as $release_as"
          if [ "${DRY_RUN,,}" = "true" ]; then
            npx --yes commit-and-tag-version@13 $args --dry-run
            exit 0
          fi

          # Bumps package.json (+ package-lock.json), writes CHANGELOG.md, commits
          # "chore(release): X.Y.Z" and tags vX.Y.Z.
          npx --yes commit-and-tag-version@13 $args
          git push --follow-tags origin "HEAD:$branch"
        displayName: commit-and-tag-version + push
        env:
          RELEASE_AS: ${{ parameters.releaseAs }}
          DRY_RUN: ${{ parameters.dryRun }}
