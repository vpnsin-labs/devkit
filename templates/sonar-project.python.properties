# SonarCloud / SonarQube Cloud project config (Python).
# Find the org & project keys in SonarCloud → your project → Information.
sonar.organization=YOUR_SONAR_ORG
sonar.projectKey=YOUR_ORG_YOUR_REPO
# sonar.projectName=Your Project

sonar.sources=.
sonar.tests=tests
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/temp/**,tests/**
sonar.python.version=3.12,3.13

# If you generate coverage (uv run pytest --cov=app --cov-report=xml), point Sonar at it:
# sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
