name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Auto-cancel superseded runs on the same ref to save Actions minutes (metered on private repos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  quality:
    name: Build, format-check & test
    runs-on: ubuntu-latest
    # Hard cap so a hung job can't drain the Actions minute quota (metered on private repos).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installs the SDK pinned in global.json (rollForward applies).
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Free dependency vulnerability report — stands in for GHAS Dependency Review on
      # private repos. Non-blocking: `dotnet list` exits 0 even with findings, so grep.
      - name: Audit dependencies
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
        continue-on-error: true

      # Warnings are errors and .editorconfig style rules are enforced (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Lint (Markdown)
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
